version: '3.8'

services:
  fb-profile-processor:
    build: .
    container_name: fb-profile-processor
    ports:
      - "8501:8501"
    volumes:
      # Mount database directory to persist data
      - ./data:/app/data
      # Mount Firefox profile if exists (optional)
      - ~/.mozilla:/root/.mozilla:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - BROWSER_TYPE=firefox
      - ENABLE_API=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
